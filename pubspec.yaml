name: ava
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  auto_size_text: ^3.0.0
  cached_network_image: ^3.3.1
  collection: ^1.18.0
  cupertino_icons: ^1.0.6
  dio: ^5.4.1
  equatable: ^2.0.5
  file_picker: ^8.0.5
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_image_converter: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.0
  flutter_map_animations: ^0.7.0
  flutter_rating_stars: ^1.1.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.2.2
  flutter_stepindicator: ^0.1.7
  flutter_svg: ^2.0.10+1
  flutter_widget_from_html_core: ^0.15.1
  freezed_annotation: ^2.4.1
  gal: ^2.3.0
  geolocator: ^12.0.0
  go_router: ^14.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.5.1
  image: ^4.2.0
  image_picker: ^1.0.7
  intl: ^0.20.2
  json_annotation: ^4.9.0
  latlong2: ^0.9.0
  logger: ^2.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.2
  pdf: ^3.11.0
  permission_handler: ^11.3.0
  persian_datetime_picker: ^2.7.0
  persian_number_utility: ^1.1.4
  photo_view: ^0.15.0
  pinput: ^4.0.0
  printing: ^5.13.1
  readmore: ^3.0.0
  rect_getter: ^1.1.0
  riverpod_annotation: ^2.3.5
  rxdart: ^0.27.7
  scroll_to_index: ^3.0.1
  shimmer: ^3.0.0
  signalr_core: ^1.1.2
  skeletonizer: ^1.3.0
  smooth_page_indicator: ^1.1.0
  snapping_bottom_sheet: ^1.0.4
  time_range_picker: ^2.3.0
  toastification: ^1.2.1
  url_launcher: ^6.3.0
  uuid: ^4.3.3
#  video_player: ^2.8.3
#  flutter_sound: ^9.4.20
#  audioplayers: ^6.0.0

dev_dependencies:
  build_runner: ^2.4.8
  custom_lint: ^0.6.4
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  freezed: ^2.4.7
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/temp/
    - assets/images/svg/
    - assets/images/svg/navbar/

  fonts:
    - family: Abar
      fonts:
        - asset: assets/fonts/AbarLowFaNum-Regular.otf
          weight: 400
        - asset: assets/fonts/AbarLowFaNum-SemiBold.otf
          weight: 600
        - asset: assets/fonts/AbarLowFaNum-Bold.otf
          weight: 700
        - asset: assets/fonts/AbarLowFaNum-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/AbarLowFaNum-Black.otf
          weight: 900

    - family: AbarTTF
      fonts:
        - asset: assets/fonts/AbarLowFaNum-Regular.ttf
          weight: 400

    - family: AbarEnNum
      fonts:
        - asset: assets/fonts/AbarLow-Regular.otf
          weight: 400

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
